services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    env_file:
      - path: ../.env
        required: false
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      SPARK_LOCAL_IP: 127.0.0.1
      UV_CACHE_DIR: /home/vscode/.cache/uv
      UV_LINK_MODE: copy
    volumes:
      - ..:/workspaces/oracle-pyspark-account-pipeline:cached
      - uv-cache:/home/vscode/.cache/uv
      - spark-ivy-cache:/home/vscode/.ivy2
    depends_on:
      oracle:
        condition: service_healthy

  oracle:
    image: container-registry.oracle.com/database/free@sha256:b97a43b16688df49582698cc5d2e81c50e6d4f663141366ee101af54413e8758
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:1521:1521"
    shm_size: 2g
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 5m

volumes:
  oracle-data:
  spark-ivy-cache:
  uv-cache:
