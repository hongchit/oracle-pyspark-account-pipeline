[project]
name = "oracle-pyspark-account-pipeline"
version = "0.1.0"
description = "Local Oracle and PySpark development infrastructure for an account pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Henry Chan" },
]
dependencies = [
  "oracledb>=3.4,<4",
  "pyspark==4.2.0",
]

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "jupyterlab>=4,<5",
  "pytest>=9,<10",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
package = false

