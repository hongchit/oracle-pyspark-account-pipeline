[project]
name = "oracle-pyspark-account-pipeline"
version = "0.1.0"
description = "Local Oracle and PySpark development infrastructure for an account pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Henry Chan" },
]
dependencies = [
  "oracledb>=3.4,<4",
  "pyspark==4.2.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ipykernel>=7,<8",
  "jupyterlab>=4,<5",
  "pytest>=9,<10",
  "pytest-ruff>=0.5,<0.6",
  "pyyaml>=6,<7",
  "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra --ruff --ruff-format"
testpaths = ["src", "tests", "notebooks"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "account_migration"
